<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Filmes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .film-card {
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            border-radius: 15px;
            transition: transform 0.2s;
        }
        .film-card:hover {
            transform: translateY(-5px) scale(1.03);
        }
        .film-release {
            font-size: 0.95em;
            color: #6c757d;
        }
        .film-rating {
            font-weight: bold;
            color: #ffc107;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <h1 class="mb-4 text-center">Filmes</h1>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="film, iterStat : ${films}">
            <div class="card film-card h-100" style="cursor:pointer;" data-bs-toggle="collapse" th:attr="data-bs-target='#collapseFilm' + ${film.id}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${film.title}">Título</h5>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="film-rating">
                            <i class="bi bi-star-fill"></i>
                            <span th:text="${film.vote_average}">8.5</span>
                        </span>
                        <span class="film-release" th:text="${film.release_date}">2025-01-01</span>
                    </div>
                </div>
                <div th:id="'collapseFilm' + ${film.id}" class="collapse">
                    <div class="card-body border-top mt-2">
                        <strong>ID: </strong><span th:text="${film.id}"></span>
                        <!-- Você pode colocar mais detalhes aqui -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap Icons CDN (for star icon) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<!-- Bootstrap JS (necessário para o collapse funcionar) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
