<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de filmes</title>
</head>
<body>
<h1>Filmes</h1>
<table border="1">
    <tr>
        <th>Title</th>
        <th>Overview</th>
    </tr>
    <tr th:each="film : ${films}">
        <td th:text="${film.title}">Title</td>
        <td th:text="${film.overview}">Overview</td>
    </tr>
</table>
</body>
</html>
